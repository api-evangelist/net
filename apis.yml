name: NET
description: NET is Network Equipment Technologies, Inc. (formerly NYSE ticker NET), a networking
  and telecommunications hardware company known for enterprise Session Border Controllers
  (SBCs) and secure networking equipment, including a large U.S. Federal Government
  installed base. Surfaced as an exited portfolio company of Battery Ventures, the
  company was acquired by Sonus Networks in August 2012 (approximately $42M) and later
  folded into what is now Ribbon Communications. It no longer operates as an independent
  entity, publishes no public developer program, and has no live domain or API surface.
